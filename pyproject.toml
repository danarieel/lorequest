[project]
name = "lorequest"
version = "0.1.0"
description = "Telegram quests with a local LLM: scripted plot, generated commentary, hallucination guards"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["aiogram>=3.4,<4", "aiohttp>=3.9", "apscheduler>=3.10,<4", "pyyaml>=6"]

[project.scripts]
lorequest = "lorequest.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lorequest"]
